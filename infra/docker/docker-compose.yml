# Supporting services for a production-style deployment.
#
# NOTE: this file has NOT been executed in the development sandbox used to build the
# project (no Docker engine was available there). It mirrors the documented configuration;
# treat it as a starting point and validate it on your worker before relying on it.
#
# Security rule: the Docker socket is mounted ONLY into the runner, never into api/web.
name: cipherforge

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cipherforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: cipherforge
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cipherforge -d cipherforge"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://cipherforge:${POSTGRES_PASSWORD}@postgres:5432/cipherforge
      CF_APP_SECRET: ${CF_APP_SECRET:?set CF_APP_SECRET}
      CF_RUNNER_SECRET: ${CF_RUNNER_SECRET:?set CF_RUNNER_SECRET}
      CF_RUNNER_URL: http://runner:7100
      CF_PORT: "5000"
      CF_SEED_ADMIN_EMAIL: ${CF_SEED_ADMIN_EMAIL:-admin@cipherforge.dev}
      CF_SEED_ADMIN_PASSWORD: ${CF_SEED_ADMIN_PASSWORD:?set CF_SEED_ADMIN_PASSWORD}
    ports:
      - "5000:5000"
    # No docker socket here. Ever.

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "8080:80"

  runner:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.runner
    restart: unless-stopped
    environment:
      CF_DRIVER: docker
      CF_RUNNER_SECRET: ${CF_RUNNER_SECRET}
      CF_RUNNER_PORT: "7100"
      CF_RUNNER_BIND: 0.0.0.0
      CF_RUNTIME_DIR: /var/lib/cipherforge
      CF_MAX_SESSIONS: ${CF_MAX_SESSIONS:-20}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-data:/var/lib/cipherforge
    # The runner must not be published to the internet; keep it on the internal network
    # and firewall it to the api service only.
    expose:
      - "7100"

volumes:
  pgdata:
  runner-data:
